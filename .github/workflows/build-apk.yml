name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# Un push nuevo cancela el build anterior de la misma rama.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      # Cada build tiene su versión (1.0.<número de build>) para distinguir los APK en el celular.
      - name: Poner número de versión
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            j.expo.version = process.argv[1];
            j.expo.android.versionCode = Number(process.argv[2]);
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2) + "\n");
          ' "$VERSION" "${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Chequear tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Tests del intérprete de voz
        run: npm test

      - name: Empaquetar JavaScript (detecta imports rotos rápido)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"

      - name: Generar proyecto nativo (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Incluir modelo de voz (Whisper) en el APK
        run: bash scripts/fetch-model.sh

      - name: Compilar APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renombrar APK con la versión
        run: mv android/app/build/outputs/apk/release/app-release.apk "stock-cateteres-${{ steps.version.outputs.version }}.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-cateteres-${{ steps.version.outputs.version }}
          path: stock-cateteres-${{ steps.version.outputs.version }}.apk
